---
- name: Create Libvirt vBMC nodes
  gather_facts: false
  become: true
  hosts: sushy-libvirt
  tasks:
    - name: Gather facts
      setup:
      delegate_to: localhost

    - name: Install Python requirements
      ansible.builtin.pip:
        name:
          - libvirt-python==11.3.0
          - lxml==5.4.0
      delegate_to: localhost

    - name: Define vBMC storage pool
      community.libvirt.virt_pool:
        command: define
        name: default
        xml: "{{ lookup('template', sushy_directory + '/vbmc-pool.xml.j2') }}"
      delegate_to: localhost
      run_once: true

    - name: Start vBMC storage pool
      community.libvirt.virt_pool:
        state: active
        name: default
      delegate_to: localhost
      run_once: true

    - import_role:
        name: stackhpc.libvirt-vm
      vars:
        libvirt_vm_arch: x86_64
        libvirt_vms:
          - state: present
            name: "{{ inventory_hostname }}"
            uuid: "{{ uuid }}"
            memory_mb: '4660'
            vcpus: '2'
            cpu_mode: 'host-model'
            # xml_file: "{{ sushy_directory }}/vbmc-node.xml.j2"
            volumes:
              - name: '{{ inventory_hostname }}.qcow2'
                device: 'disk'
                format: 'qcow2'
                # capacity: '20GB'
                pool: 'default'
                file_path: '/var/lib/libvirt/images/{{ inventory_hostname }}.qcow2'
                type: 'file'
            interfaces:
              - network: 'default'
                source:
                  dev: 'breth1'
                  mode: 'bridge'
            start: false
            autostart: false
            boot_firmware: uefi
      delegate_to: localhost

    - name: Discover Virtual Baremetal UUID
      ansible.builtin.command: "virsh domuuid {{ inventory_hostname }}"
      register: vm_uuid_result
      delegate_to: localhost

    - name: Persist UUID fact
      ansible.builtin.set_fact:
        uuid: "{{ vm_uuid_result.stdout }}"
      delegate_to: "{{ inventory_hostname }}"
      delegate_facts: true

    - name: Ensure host_vars directory exists
      ansible.builtin.file:
        path: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}"
        state: directory
      delegate_to: localhost

    - name: Write UUID to host_vars
      ansible.builtin.copy:
        dest: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/uuid.yml"
        content: "uuid: {{ vm_uuid_result.stdout }}\n"
      delegate_to: localhost
